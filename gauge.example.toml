# Gauge policy. Account IDs must be canonical G addresses.
# `network` is required and has no default: mainnet, testnet or a full passphrase.
version = 1
network = "testnet"
endpoints = ["https://horizon-testnet.stellar.org"]

[[account]]
# Public SEP-23 test vector; replace it with the account you audit.
id = "GA7QYNF7SOWQ3GLR2BGMZEHXAVIRZA4KVWLTJJFC7MGXUA74P7UJVSGZ"
name = "treasury"
# A role weights the report rather than changing what is checked: a treasury reads
# single-key control and drift as HIGH, and a role can only raise a severity.
role = "treasury"
expected_signers = [
  { key = "GA7QYNF7SOWQ3GLR2BGMZEHXAVIRZA4KVWLTJJFC7MGXUA74P7UJVSGZ", weight = 1 },
]
expected_thresholds = { low = 1, medium = 2, high = 2 }
expected_flags = { auth_required = false, auth_revocable = false, auth_immutable = false, clawback = false }
# A declared domain is a finding when the chain shows none. The role alone is not
# enough: Appendix A expects a home domain from an issuer, and this account declares
# a treasury, so only this line makes the missing domain a warning.
home_domain = "example.com"
# expect_locked states that a zero-weight, nonsigning account is intended. It is
# read for `issuer` alone; on a treasury it changes nothing, and the report prints
# the declaration as ignored rather than letting it read as a covered risk.
expect_locked = false

# Only the owner adds accept entries, always with a reason. The expiry is optional.
# A rule that hides a missing account, a network mismatch or an unreachable
# threshold cannot be accepted at all.
# [[accept]]
# rule = "flag-undeclared-clawback"
# account = "G..."
# reason = "..."
# expires = "2027-04-27"

# An omitted expectation differs from an explicitly empty, zero or false value, and
# `audit` prints a `declared:` block naming which of them this file carried. A drift
# rule that found nothing to compare says so here instead of looking like a clean
# account.

# What is compared today, all of it read from the entries above: `expected_signers`
# by three rules (a key the chain does not show, a key the declaration does not, and
# a key at a different weight), `expected_thresholds` by the threshold drift rule,
# `expected_flags` by the two flag rules, and `home_domain` by the identity rule. The
# role re-weights every finding the run produced. Nothing in this file is loaded and
# ignored: 3.1 landed the signer and threshold family on 2026-11-04, 3.4 the role
# table, and 3.7 the report that prints which of these lines a policy carried.
