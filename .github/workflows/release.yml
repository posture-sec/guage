name: release

# A version tag is the only trigger. The tag is cut by the owner from a commit on `main`
# (ROADMAP.md 6.2), never by a branch push and never by this workflow: the run reacts to the
# tag, builds the archives, attests them and only then publishes them.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: release / build
    runs-on: ubuntu-latest
    # The provenance attestation is signed with the run's OIDC token and stored against this
    # repository, so this job holds exactly those two writes. It cannot publish anything.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build archives
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            dir="dist/stellar-gauge-${version}-${os}-${arch}"
            mkdir -p "${dir}"
            ext=""
            if [ "${os}" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
              -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "${dir}/stellar-gauge${ext}" ./cmd/stellar-gauge
            cp LICENSE "${dir}/LICENSE"
          done
          for os in linux darwin; do
            for arch in amd64 arm64; do
              dir="stellar-gauge-${version}-${os}-${arch}"
              ( cd "dist/${dir}" && tar -czf "../${dir}.tar.gz" . )
            done
          done
          ( cd "dist/stellar-gauge-${version}-windows-amd64" \
            && zip -qr "../stellar-gauge-${version}-windows-amd64.zip" . )
          ( cd dist && sha256sum stellar-gauge-"${version}"-*.tar.gz \
              stellar-gauge-"${version}"-windows-amd64.zip > checksums.txt )
      - name: verify checksums
        run: cd dist && sha256sum -c checksums.txt
      # The task 4.5 mechanism, unchanged: one attested subject per published file, signed by
      # this run and stored against this repository.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/stellar-gauge-*.tar.gz
            dist/stellar-gauge-*.zip
            dist/checksums.txt
      - name: verify attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in dist/stellar-gauge-*.tar.gz dist/stellar-gauge-*.zip dist/checksums.txt; do
            gh attestation verify "$f" --repo "${GITHUB_REPOSITORY}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          digest: sha256

  publish:
    name: release / publish
    needs: build
    runs-on: ubuntu-latest
    # The only write in this workflow: creating the release and attaching its assets after the
    # build job's attestations have been re-verified here.
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: verify checksums and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ( cd dist && sha256sum -c checksums.txt )
          for f in dist/stellar-gauge-*.tar.gz dist/stellar-gauge-*.zip dist/checksums.txt; do
            gh attestation verify "$f" --repo "${GITHUB_REPOSITORY}"
          done
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            printf 'Checksums (SHA-256) for `v%s`:\n\n```\n' "${version}"
            cat dist/checksums.txt
            printf '```\n\n'
            printf 'Verify a download with `sha256sum -c checksums.txt` (macOS: `shasum -a 256 -c checksums.txt`; Windows: compare `CertUtil -hashfile <file> SHA256` by eye).\n\n'
            printf 'Provenance is attested. Verify it with:\n\n```\ngh attestation verify stellar-gauge-%s-linux-amd64.tar.gz --repo %s\n```\n\n' "${version}" "${GITHUB_REPOSITORY}"
            printf 'Built from tag `%s` by %s/actions/runs/%s.\n' "${GITHUB_REF_NAME}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
          } > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            dist/stellar-gauge-"${version}"-*.tar.gz \
            dist/stellar-gauge-"${version}"-windows-amd64.zip \
            dist/checksums.txt \
            --verify-tag \
            --title "stellar-gauge v${version}" \
            --notes-file release-notes.md
