name: Task
description: A roadmap row someone can pick up cold, written to the PI-1 contract.
labels: ["needs triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Every issue in this organization carries the nine sections below, in this order, defined in
        `posture-sec/.github`'s `ISSUE_CONTRACT.md`. A heading never disappears: if one has nothing
        to say, it says why. Fill all nine and keep the body between roughly 2500 and 5000
        characters. The planned backlog is generated by `scripts/generate_issues.sh`, which reads
        `ROADMAP.md` and one curated prose row per task, so a task-shaped issue normally comes from
        rerunning that script rather than from this form. Use this form for an issue the generator
        does not cover: a bug that is not a roadmap row, a documentation gap, or a shape the rules
        should learn. Set the `area:` and `type:` labels after opening, and the `complexity:` label
        only when the roadmap carries a size for the row. Do not add the `Stellar Wave` label: the
        tier belongs in the program dashboard, and a GitHub tag fixes an issue at Trivial whatever
        the work turns out to be.
  - type: input
    id: task-id
    attributes:
      label: Roadmap task id
      description: >-
        The `ROADMAP.md` row this issue carries, for example `3.7`, `G4` or `report`. The roadmap is
        the source of truth: if a row does not exist yet, add it in the pull request first, with the
        prose row in `scripts/generate_issues.sh` if the task belongs in the published backlog.
      placeholder: "3.7"
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
      description: Conventional Commits style, the subject a branch and the pull request will carry.
      placeholder: "feat(rules): flag an account whose home domain does not resolve"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: >-
        Goes in the marker line. `task` is a roadmap row, `gate` is a readiness claim that closes on
        an observed run, `owner` is an act only the account owner can take, `report` is something
        wrong that has no row yet.
      options:
        - task
        - gate
        - owner
        - report
      default: 0
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Work order
      description: >-
        Fill every section. The marker line on the first row has to name this repository and the task
        id, and every path cited in section 3 has to be a path that exists.
      value: |
        <!-- posture-issue: guage/TASK-ID | contract: PI-1 | kind: task -->

        > One sentence of intent: what stops being true, or what starts working, when this is done.

        ## 1 · Why this exists

        Two to five sentences. The problem as it exists outside this file: which operator is misled,
        which requirement (FR-nn) or decision (D-nn) this serves, why here rather than in a consumer's
        own code, and why now. Name the run, the fixture or the row that found it.

        ## 2 · Done when

        - [ ] Observable condition, copied from the row's `Done when:` clause
        - [ ] One box per condition, split at semicolons
        - [ ] `ROADMAP.md` task TASK-ID is ticked in this pull request, with a changelog row stamped
              from `date -u`, the progress table regenerated and `Last updated` refreshed

        Source of truth: `ROADMAP.md` section SECTION, task TASK-ID. If this issue and that row
        disagree, the row is right and this issue is stale.

        ## 3 · Where the work lands

        Paths that exist today, each with one line about what changes there, plus any new file with
        its intended path and why it is new. Placement follows `project_structure.md`; a new package
        needs the import direction in its section 3 to still hold.

        ## 4 · Read before writing

        1. `ROADMAP.md`: this row, section 4 on current focus, and the decision-log rows cited above.
        2. `AGENTS.md` sections 4 and 5, and `ARCHITECTURE_ESSENTIALS.md` section 2.
        3. `project_structure.md` sections 2, 4 and 5 for protected paths and naming.
        4. The document or package that governs this particular change.
        5. Setup: Go 1.27.3 from `go.mod`, then `go install` the pinned `staticcheck` v0.8.2 and
           `govulncheck` v1.9.0.

        ## 5 · Rules that bind this issue

        The two to five hard rules from `AGENTS.md` section 4 that this change can break, each with
        the file or test that enforces it. Always include the rule that no check may be weakened,
        skipped or deleted to make something pass. For a gate, the heading reads
        `## 5 · Rules that bind this gate`.

        ## 6 · How to prove it

        ```
        $ gofmt -l .
        $ go vet ./...
        $ staticcheck ./...
        $ go test ./... -race -count=1
        $ govulncheck ./...
        $ scripts/check_roadmap_touched.sh origin/main
        $ scripts/roadmap_progress.sh --check ROADMAP.md
        $ scripts/test_roadmap_gate.sh
        $ scripts/generate_issues.sh --check
        $ scripts/test_issue_shape.sh
        ```

        **Local half:** what a person at a desk produces, and where to paste it. Verbatim output in
        the pull request's testing section, not a description of it.

        **Hosted half:** the workflow and job whose log carries the rest, who can trigger it, and what
        to write if you cannot. A fork's green run is evidence about a fork.

        ## 7 · Out of scope

        The adjacent temptations this issue does not authorize. The line that almost always belongs: a
        new module, a bump of a pinned action or a change to a refusal in a validator needs the
        owner's agreement before the work, not in the pull request after it.

        ## 8 · Handoff

        The branch to cut from `main` (`<type>/<task-id>-<slug>`), the pull request template sections
        this issue fills, the protected paths involved and who reviews them, and the three things a
        reviewer checks first.

        ## 9 · When to stop and ask

        The blockers specific to this issue, then how to ask: comment here, name the rule or the row
        that blocks you, and stop. Do not open a pull request that works around a hard rule.
      render: markdown
    validations:
      required: true
